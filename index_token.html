<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 Ultrasonic Monitor (DNS + Token)</title>
<style>
  :root { --bg:#0f172a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); font-family:system-ui,"Noto Sans Thai",sans-serif; color:#fff; padding:16px; }
  .wrap { width:100%; max-width:440px; }
  .conn { display:grid; gap:8px; margin-bottom:14px; }
  .conn input { padding:10px; border-radius:8px; border:1px solid #475569; background:#1e293b; color:#fff; font-size:16px; }
  .conn button { padding:11px; border:0; border-radius:8px; background:#3b82f6; color:#fff; font-size:16px; cursor:pointer; }
  #card { border-radius:20px; padding:32px 20px; text-align:center; background:#475569;
          transition:background .25s; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  #card.green  { background:#16a34a; }
  #card.yellow { background:#eab308; color:#1f2937; }
  #card.red    { background:#dc2626; }
  #card.off    { background:#475569; }
  #status { font-size:20px; font-weight:600; margin-bottom:14px; }
  .box { display:inline-block; min-width:220px; padding:14px 24px; border:4px solid currentColor; border-radius:14px; }
  #dist { font-size:64px; font-weight:700; font-variant-numeric:tabular-nums; }
  .unit { font-size:24px; margin-left:6px; }
  #buzz { margin-top:24px; width:100%; padding:16px; font-size:20px; font-weight:600; border:0; border-radius:12px;
          background:#fff; color:#111; cursor:pointer; }
  #buzz:active { transform:scale(.97); }
  #buzz:disabled { opacity:.5; cursor:not-allowed; }
  #msg { margin-top:10px; font-size:14px; opacity:.9; min-height:18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="conn">
    <input id="host" placeholder="โดเมน เช่น myesp32.duckdns.org">
    <input id="token" type="password" placeholder="Access Token (ตรงกับ API_TOKEN ใน ESP32)">
    <button id="connect">เชื่อมต่อ</button>
  </div>

  <div id="card" class="off">
    <div id="status">ยังไม่ได้เชื่อมต่อ</div>
    <div class="box"><span id="dist">--</span><span class="unit">cm</span></div>
    <button id="buzz" disabled>🔔 ส่งเสียงบัซเซอร์ 1 วินาที</button>
    <div id="msg"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let base = "", token = "", timer = null;

try {
  $("host").value  = localStorage.getItem("esp_host")  || "";
  $("token").value = localStorage.getItem("esp_token") || "";
} catch(e) {}

function setView(cls, text) { $("card").className = cls; $("status").textContent = text; }

const url = path => base + path + "?token=" + encodeURIComponent(token);

async function poll() {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 2000);
  try {
    const r = await fetch(url("/data"), { signal: ctrl.signal, cache: "no-store" });
    if (r.status === 401) {
      setView("off", "โทเค่นไม่ถูกต้อง");
      $("dist").textContent = "--";
      $("buzz").disabled = true;
      return;
    }
    const d = await r.json();
    $("dist").textContent = d.distance >= 400 ? "> 400" : d.distance.toFixed(1);
    if (d.state === 2)      setView("red",    "🔴 อันตราย! ใกล้มาก (≤ 5 cm)");
    else if (d.state === 1) setView("yellow", "🟡 ระวัง! เริ่มเข้าใกล้ (≤ 10 cm)");
    else                    setView("green",  "🟢 ปลอดภัย (> 10 cm)");
    $("buzz").disabled = false;
    $("msg").textContent = "";
  } catch (e) {
    setView("off", "ติดต่อ ESP32 ไม่ได้ (ตรวจโดเมน/เครือข่าย)");
    $("dist").textContent = "--";
    $("buzz").disabled = true;
  } finally { clearTimeout(t); }
}

$("connect").onclick = () => {
  const host = $("host").value.trim().replace(/^https?:\/\//, "").replace(/\/$/, "");
  token = $("token").value.trim();
  if (!host || !token) { $("msg").textContent = "กรุณาใส่โดเมนและโทเค่น"; return; }
  base = "http://" + host;
  try { localStorage.setItem("esp_host", host); localStorage.setItem("esp_token", token); } catch(e) {}
  clearInterval(timer);
  poll();
  timer = setInterval(poll, 300);
};

$("buzz").onclick = async () => {
  $("buzz").disabled = true;
  try {
    const r = await fetch(url("/buzz"), { cache: "no-store" });
    $("msg").textContent = r.ok ? "ส่งคำสั่งแล้ว: บัซเซอร์ดัง 1 วินาที" : "โทเค่นไม่ถูกต้อง";
  } catch (e) { $("msg").textContent = "ส่งคำสั่งไม่สำเร็จ"; }
  setTimeout(() => { $("buzz").disabled = false; }, 1000);
};
</script>
</body>
</html>
